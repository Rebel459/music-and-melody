plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom-remap'
}

dependencies {
    mappings loom.layered() {
        officialMojangMappings()
    }

    minecraft "com.mojang:minecraft:${minecraft_version}"
    modApi "net.fabricmc:fabric-loader:${fabric_loader}"
    modApi("net.fabricmc.fabric-api:fabric-api:${fabric_api}")

    modApi("com.terraformersmc:modmenu:$modmenu_version")

    modApi("me.shedaniel.cloth:cloth-config-fabric:$cloth_version") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    compileOnly("maven.modrinth:simple-music-control:$simple_music_control-fabric")
    modImplementation("maven.modrinth:fzzy-config:$fzzy_version")
    modRuntimeOnly("me.lucko:fabric-permissions-api:0.6.1")
    runtimeOnly("blue.endless:jankson:1.2.3")
    runtimeOnly("net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7")
    modImplementation("net.fabricmc:fabric-language-kotlin:$kotlin_fabric") {
        exclude(group: "net.fabricmc", module: "fabric-loader")
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.classtweaker")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet("main", ":common")
        }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
