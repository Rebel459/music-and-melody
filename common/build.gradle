plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.5"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
    annotationProcessor "io.github.llamalad7:mixinextras-common:0.5.3"
    implementation "org.ow2.asm:asm:9.9.1"
    implementation "org.ow2.asm:asm-tree:9.9.1"

    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:$cloth_version")
    compileOnly("maven.modrinth:unified-api:$unified_version-fabric")

    compileOnly("maven.modrinth:simple-music-control:$simple_music_control-fabric")
    compileOnly("maven.modrinth:fzzy-config:$fzzy_version")
    compileOnly("maven.modrinth:fabric-language-kotlin:$kotlin_fabric")
    compileOnly("maven.modrinth:fancymenu:$fancymenu_version-fabric")
}

def curseforgeBuild = providers.gradleProperty('curseforgeBuild')
        .map { it.toBoolean() }
        .orElse(false)
        .get()
def curseforgeJava = null

if (curseforgeBuild) {
    curseforgeJava = tasks.register('syncCurseForgeCommonJava', Sync) {
        into layout.buildDirectory.dir('generated/curseforge/java')
        from('src/main/java') {
            exclude 'net/rebel459/music_and_melody/client/remote/RemoteAlbumManager.java'
        }
        from('src/curseforge/java')
    }

    sourceSets.main.java.setSrcDirs([curseforgeJava.map { it.destinationDir }])

    tasks.named('compileJava') {
        dependsOn(curseforgeJava)
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    commonCompileOnly {
        canBeResolved = false
        canBeConsumed = true
        extendsFrom compileOnly
    }
}

artifacts {
    commonJava(sourceSets.main.java.sourceDirectories.singleFile) {
        if (curseforgeJava != null) builtBy(curseforgeJava)
    }
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
